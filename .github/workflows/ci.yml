name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: this workflow only reads the repo and builds/tests it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + Test (tsc + vitest), Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # engines.node is >=22: every supported line, oldest to newest.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build (tsc)
        run: npm run build

      - name: Test with coverage thresholds (vitest)
        run: npm run test:coverage

      - name: Type-check tests
        run: npm run typecheck:spec

      - name: Verify publish artifact
        run: npm pack --dry-run

      # Installs the real tarball into a temp project outside the checkout and
      # runs examples/refund-authorization/selfcheck.mjs against it.
      - name: Packed-install smoke on Node ${{ matrix.node }}
        run: npm run smoke:packed

  image:
    name: Reproducible image smoke
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile repeats build + tests and its final stage must load the
      # compiled ESM package as a non-root user.
      - name: Build image
        run: docker build -t praesidia-sdk:ci .

      - name: Smoke image and verify runtime user
        run: |
          docker run --rm praesidia-sdk:ci
          USER_NAME="$(docker image inspect --format '{{.Config.User}}' praesidia-sdk:ci)"
          case "${USER_NAME}" in
            ''|0|root) echo "image runs as unsafe user '${USER_NAME}'"; exit 1 ;;
          esac
