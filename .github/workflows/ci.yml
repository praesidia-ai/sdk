name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: this workflow only reads the repo and builds/tests it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + Test (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build (tsc)
        run: npm run build

      - name: Test with coverage thresholds (vitest)
        run: npm run test:coverage

      - name: Type-check tests
        run: npm run typecheck:spec

      - name: Verify publish artifact
        run: npm pack --dry-run

      - name: Select declared minimum runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '18'

      - name: Smoke compiled package on Node 18
        run: node -e "import('./dist/index.js').then(m => console.log('Node 18 OK —', Object.keys(m).length, 'exports'))"

  image:
    name: Reproducible image smoke
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The Dockerfile repeats build + tests and its final stage must load the
      # compiled ESM package as a non-root user.
      - name: Build image
        run: docker build -t praesidia-sdk:ci .

      - name: Smoke image and verify runtime user
        run: |
          docker run --rm praesidia-sdk:ci
          USER_NAME="$(docker image inspect --format '{{.Config.User}}' praesidia-sdk:ci)"
          case "${USER_NAME}" in
            ''|0|root) echo "image runs as unsafe user '${USER_NAME}'"; exit 1 ;;
          esac
