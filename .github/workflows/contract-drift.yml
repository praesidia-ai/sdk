name: 🔗 API Contract Drift

# CD-0006 — sdk/src/*.ts hand-writes route strings/bodies against be-core's
# REST API. `@praesidia/sdk` is a PUBLISHED, customer-installed npm package —
# nothing checked its calls against be-core before this: a be-core route
# rename or DTO field drop would ship silently to npm and 404/400 in a
# customer's application against a version they cannot easily roll back.
# Shape/steps mirror `mcp/.github/workflows/contract-drift.yml` (CD-0001) —
# same MONO-003 sibling-checkout pattern, same fresh-`export:openapi` source
# of truth — via `scripts/audit-api-contract.mjs` (see that file's header
# for why it is a generalized COPY of mcp's scanner, not an import).
#
# AUD-0063 — this job is also the ONLY place in CI where a fresh be-core spec
# is available, so it additionally runs the analytics resource coverage gate
# (src/analytics.coverage.spec.ts) against this job's real
# `swagger.generated.json`. `ci.yml` runs `npm test` but checks out sdk
# alone, so that test only SKIPS there — this job is what makes it capable
# of actually failing a PR when be-core adds an analytics route the SDK
# doesn't cover. Mirrors mcp's identical AUD-0062 step verbatim.

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod, develop]

permissions:
  contents: read

concurrency:
  group: sdk-contract-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sdk (the PR under test)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: sdk

      - name: Checkout be-core (spec source of truth)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: praesidia-ai/be-core
          path: be-core
          token: ${{ secrets.BE_CORE_READ_TOKEN || github.token }}

      - name: Checkout queue-core (be-core's local package sibling)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: praesidia-ai/queue-core
          path: shared
          token: ${{ secrets.QUEUE_CORE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: be-core/package-lock.json

      - name: Build queue-core sibling
        working-directory: be-core
        run: npm run ci:prepare-queue-core

      - name: Install be-core deps
        working-directory: be-core
        run: npm ci

      - name: Export current OpenAPI from be-core
        working-directory: be-core
        env:
          OPENAPI_OUT: ../swagger.generated.json
          NODE_ENV: test
          JWT_SECRET: dummy-jwt-secret-for-export-openapi-only-32chars
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praesidia
        run: npm run export:openapi

      - name: Install sdk deps
        working-directory: sdk
        run: npm ci

      - name: Audit sdk's hand-written API calls against the fresh be-core spec
        working-directory: sdk
        run: npm run lint:api-contract -- ../swagger.generated.json

      # AUD-0063 — this repo's own `npm test` (ci.yml) never sees a be-core
      # checkout, so run the live analytics-route coverage check here
      # instead, where `../../swagger.generated.json` (this job's fresh
      # export, resolved from src/) genuinely exists.
      #
      # Deliberately NOT `vitest run -t "<title>"`: `-t` exits 0 when the
      # pattern matches zero tests (a renamed test title would silently stop
      # gating), so this runs the file BY PATH instead — `vitest run <path>`
      # exits 1 if that path ever matches nothing (file renamed/deleted).
      # AUD_0063_REQUIRE_SWAGGER=true additionally turns "no spec found"
      # from a skip into a hard failure in THIS job specifically (see the
      # spec file's own doc comment) — this job's only reason to run it is
      # having a fresh be-core export, so it must never go green having
      # never read one. Mirrors mcp's AUD-0062 step verbatim.
      - name: AUD-0063 — analytics resource coverage vs be-core
        working-directory: sdk
        env:
          AUD_0063_REQUIRE_SWAGGER: 'true'
        run: npx vitest run src/analytics.coverage.spec.ts
