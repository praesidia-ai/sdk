name: Publish

# A release is published only from an immutable version tag whose value matches
# package.json. Configure the NPM_TOKEN repository secret before cutting a tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: npm publish (@praesidia/sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Verify tagged commit is contained in main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in main" >&2
            exit 1
          fi

      - run: npm run build
      - run: npm run typecheck:spec
      # SDK-0343 — the full suite (vitest + plugin tests, as `npm test` runs in
      # CI) and the packed-install smoke (SDK-0330) gate this tag's tarball.
      - run: npm test

      - name: Verify publish artifact
        run: npm pack --dry-run

      - name: Packed-install smoke
        run: npm run smoke:packed

      # SDK-0338 — CycloneDX SBOM of the production dependency tree (same
      # `npm run sbom` shape as be). Not in package.json `files`, so it is
      # never packed; it ships as a workflow artifact of the release run.
      - name: Generate SBOM (CycloneDX)
        run: npm run sbom

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
