[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praesidia-managed-client"
version = "0.1.0"
description = "Fixed-tool authenticated MCP client for Praesidia distribution adapters"
requires-python = ">=3.12"
dependencies = ["mcp==1.29.1", "httpx==0.28.1"]

[tool.setuptools]
py-modules = ["praesidia_managed_client"]
